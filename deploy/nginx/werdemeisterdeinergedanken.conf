# nginx-vHost für „Werde Meister deiner Gedanken“ (Hetzner)
# ---------------------------------------------------------------------------
# ALTBESTAND – NICHT IN BETRIEB.
# Auf dem Server läuft kein nginx; TLS und Routing macht Caddy
# (/opt/mattermost/caddy/Caddyfile, reverse_proxy website:3000). Die App hat
# auch keinen Host-Port mehr, auf den dieser vHost zeigen könnte – sie ist
# nur im internen Docker-Netz erreichbar. Aufgehoben als Ausweichszenario,
# falls je von Caddy weg gewechselt wird. Aktueller Stand: deploy/README.md
# ---------------------------------------------------------------------------
# Ursprüngliche Annahme: Die Next.js-App läuft auf 127.0.0.1:3000, nginx
# terminiert TLS und verteilt nach Hostname:
#
#   www.werdemeisterdeinergedanken.de   → App (kanonischer Host)
#   werdemeisterdeinergedanken.de       → 301 auf www  (Apex)
#   neu.werdemeisterdeinergedanken.de   → 301 auf www  (frühere Test-Domain)
#
# Zertifikate mit certbot (Let's Encrypt) ausstellen – siehe deploy/README.md.
# Diese Datei nach /etc/nginx/sites-available/ kopieren und in sites-enabled
# verlinken, dann: nginx -t && systemctl reload nginx
# ---------------------------------------------------------------------------

upstream wmdg_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- HTTP → HTTPS (alle Hosts) ---------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name
        werdemeisterdeinergedanken.de
        www.werdemeisterdeinergedanken.de
        neu.werdemeisterdeinergedanken.de;

    # ACME-Challenge (certbot webroot) erreichbar lassen
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.werdemeisterdeinergedanken.de$request_uri;
    }
}

# --- Apex + neu → 301 auf www (HTTPS) --------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name
        werdemeisterdeinergedanken.de
        neu.werdemeisterdeinergedanken.de;

    ssl_certificate     /etc/letsencrypt/live/www.werdemeisterdeinergedanken.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.werdemeisterdeinergedanken.de/privkey.pem;

    return 301 https://www.werdemeisterdeinergedanken.de$request_uri;
}

# --- Kanonischer Host: www → App -------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.werdemeisterdeinergedanken.de;

    ssl_certificate     /etc/letsencrypt/live/www.werdemeisterdeinergedanken.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.werdemeisterdeinergedanken.de/privkey.pem;

    # Sinnvolle Defaults (ggf. an vorhandene ssl_* Serverdefaults anpassen)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Uploads (PDF-Generierung etc.) großzügig
    client_max_body_size 15m;

    # Statische Next-Assets aggressiv cachen
    location /_next/static/ {
        proxy_pass http://wmdg_app;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://wmdg_app;
        proxy_http_version 1.1;

        # Damit Next/Proxy den echten Host + Protokoll sieht
        # (wichtig für Host-Kanonisierung & Supabase-Redirects)
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket/HMR-Kompatibilität
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
    }
}
