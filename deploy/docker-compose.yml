# ┌────────────────────────────────────────────────────────────────────────┐
# │  DIES IST NICHT DIE PRODUKTIVE COMPOSE-DATEI.                          │
# │                                                                        │
# │  Produktiv läuft die Website als Service "website" im Stack            │
# │      /opt/mattermost/docker-compose.yml                                │
# │  (dort liegen auch Caddy, Mattermost und Postgres – deshalb kann der   │
# │  Stack nicht in diesem Repo liegen). Secrets: /opt/mattermost/.env     │
# │                                                                        │
# │  Ausrollen – der einzig richtige Weg:                                  │
# │      git -C /opt/website pull                                          │
# │      docker compose -f /opt/mattermost/docker-compose.yml \            │
# │              up -d --build website                                     │
# │                                                                        │
# │  Diese Datei ist die versionierte SPIEGELUNG jenes Service, damit im   │
# │  Repo nachvollziehbar bleibt, mit welchen Build-Args, Umgebungs-       │
# │  variablen und Mounts die App produktiv läuft. Änderungen hier wirken  │
# │  NICHT live – sie müssen in /opt/mattermost/docker-compose.yml         │
# │  nachgezogen werden (und umgekehrt).                                   │
# │                                                                        │
# │  Ein "docker compose -f deploy/docker-compose.yml up" startet einen    │
# │  ZWEITEN, isolierten Container (eigenes Projekt, eigenes Netz). Caddy  │
# │  kennt ihn nicht, die Live-Seite ändert sich dadurch nicht.            │
# │                                                                        │
# │  Hintergrund und Routing: deploy/README.md                             │
# └────────────────────────────────────────────────────────────────────────┘

# Eigener Projektname, damit ein versehentlicher Start hier niemals den
# produktiven Stack "mattermost" überschreibt oder dessen Container ersetzt.
name: wmdg-website-spiegel

services:
  website:
    build:
      # Produktiv steht hier der absolute Pfad /opt/website – aus dem Repo
      # heraus ist das derselbe Ordner, nur eine Ebene über deploy/.
      context: ..
      args:
        # NEXT_PUBLIC_* backt Next.js zur BUILD-Zeit ins Client-Bundle ein.
        # Als reine Laufzeit-Variable käme der Wert im Browser nie an –
        # deshalb build.args. Änderung ⇒ Rebuild mit --build nötig.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        # GA4-Measurement-ID. Seit Commit 48e817a hat src/lib/analytics.ts
        # keinen Code-Default mehr: fehlt der Wert, bleiben Analytics UND
        # Cookie-Banner still inaktiv – ohne Fehler im Log.
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
        # Meta-Pixel-ID (optional). Lädt nur nach Einwilligung im Cookie-
        # Banner; ohne Wert bleibt der Pixel komplett inaktiv.
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 3000

      # --- Laufzeit: Änderung braucht nur "up -d", keinen Rebuild ---

      # Versand über Resend (Kontaktformular, E-Book, Impulse).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # ACHTUNG: umgeht sämtliche Row-Level-Security in Supabase. Nur für
      # serverseitige Routen (E-Book-Leads, Impuls-Versand). Kein
      # NEXT_PUBLIC_-Präfix – darf niemals im Browser landen.
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      # Schützt /api/impulses (Serienversand der E-Mail-Impulse). Ohne
      # diesen Wert lehnt die Route jeden Aufruf ab.
      CRON_SECRET: ${CRON_SECRET:-}
      # KI-Reading zum Gedankenprofil (/mitglieder/gedankenprofil). Fehlt der
      # Wert, blendet die Seite die Reading-Option aus – kein Fehler.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Zugang zum Marketing-Cockpit /admin (kommagetrennte Adressen).
      #
      # ACHTUNG: Diese Zeile setzt die Variable IMMER – fehlt der Wert in der
      # .env, kommt ein LEERER String an. src/lib/admin.ts fällt aber nur bei
      # undefined auf seine eingebaute Liste zurück (`??`), nicht bei "".
      # Ein leerer Wert sperrt also ALLE aus /admin aus. Muss gefüllt bleiben.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Apex und "neu." per 301 auf www. Seit dem Cutover dauerhaft true.
      ENFORCE_CANONICAL_HOST: ${ENFORCE_CANONICAL_HOST:-true}

      # --- Vom Code gelesen, produktiv NICHT gesetzt ---------------------
      # Die folgenden Variablen wertet src/ aus, sie stehen aber weder hier
      # noch in /opt/mattermost/.env. Alle haben einen Fallback, es ist also
      # nichts kaputt – der Standard greift:
      #
      #   CONTACT_TO           → Fallback site.email
      #   CONTACT_FROM         → Fallback onboarding@resend.dev
      #   EBOOK_FROM           → Fallback wie CONTACT_FROM
      #   MEMBERSHIP_FROM      → Fallback wie CONTACT_FROM
      #   IMPULSE_FROM         → Fallback wie CONTACT_FROM
      #   BUCH_FROM            → Fallback wie CONTACT_FROM
      #   BUCH_DOWNLOAD_SECRET → Fallback STRIPE_WEBHOOK_SECRET, sonst null
      #   REQUIRE_ACTIVE_MEMBERSHIP / ALLOW_SELF_REGISTRATION → beide false
      #                          (Code prüft strikt === "true")
      #   STRIPE_*             → ohne Wert bleibt der Bezahlweg inaktiv
      #
      # Sobald eine eigene Resend-Domain steht, gehören die *_FROM-Adressen
      # hier UND in /opt/mattermost/docker-compose.yml verdrahtet.

    # Kein ports:-Mapping – produktiv ist die App vom Host aus nicht direkt
    # erreichbar, der Zugriff läuft ausschließlich über Caddy
    # (reverse_proxy website:3000) im internen Docker-Netz, damit alles über
    # HTTPS geht. Der frühere Vorschau-Port 3002 wurde nach dem Cutover
    # entfernt; ihn hier wieder zu öffnen würde die Seite unverschlüsselt
    # ins Internet hängen.
    expose:
      - "3000"

    volumes:
      # Vorlagen-Galerie (~2 GB generierte Bilder/ZIPs, /admin/vorlagen).
      # Liegt bewusst NICHT im Repo und NICHT im Image: sie wird bei jedem
      # Generator-Lauf komplett neu geschrieben, ist aus docs/** reproduzier-
      # bar und hat das Git-Repo sonst pro Lauf um hunderte MB wachsen lassen
      # (content/vorlagen steht deshalb in .dockerignore und .gitignore).
      # Erzeugt mit "npm run vorlagen:galerie" nach /opt/website-vorlagen.
      # Nur lesend – die Seite liefert die Dateien lediglich aus
      # (src/app/admin/vorlagen/datei/[...pfad]).
      #
      # OHNE diesen Mount ist /app/content/vorlagen im Container leer und die
      # Galerie liefert für jede Datei 404.
      - /opt/website-vorlagen:/app/content/vorlagen:ro

  # ──────────────────────────────────────────────────────────────────────
  # Wöchentlicher Impuls-/Nurture-Versand (E-Mail-Impulse) + tägliche
  # Verkaufsstrecken (E-Mail-Sequenzen).
  #
  # Statt eines externen Schedulers (z. B. Vercel Cron – gibt es hier nicht)
  # übernimmt ein winziger busybox-crond-Dienst die Zeitsteuerung und ruft die
  # geschützten Routen im INTERNEN Docker-Netz auf (Servicename "website",
  # kein öffentlicher Port nötig):
  #   - montags 07:00  /api/impulses  – nächste Impuls-Rotation an Mitglieder
  #     mit Opt-in UND bestätigte Leads (außer Leads in laufender Sequenz)
  #   - täglich 08:00  /api/sequences – fällige Schritte der 7-Mail-Strecke
  #     nach Test/E-Book (Tag 0–11) und der 3-Mail-Strecke für Buch-Käufer
  #     (Tag 3/10/21); idempotent über lead_sequence_state (Migration 0018).
  #
  # Das CRON_SECRET wird beim Start in die container-interne crontab
  # geschrieben (nicht ins Image, nicht ins Repo). Fehlt es, lehnt die Route
  # jeden Aufruf mit 401 ab – es wird dann nichts verschickt.
  #
  # WICHTIG: wie der website-Service ist auch dies nur die versionierte
  # Spiegelung. Produktiv muss der Dienst ebenso in
  # /opt/mattermost/docker-compose.yml stehen.
  impuls-cron:
    image: busybox:1.37
    restart: unless-stopped
    depends_on:
      - website
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /var/spool/cron/crontabs
        # Montags 07:00 (Container-Zeit = UTC). $$CRON_SECRET wird von der
        # Shell beim Schreiben eingesetzt – der doppelte $ verhindert, dass
        # Compose die Variable schon beim Parsen ersetzt.
        echo "0 7 * * 1 wget -q -O- \"http://website:3000/api/impulses?secret=$$CRON_SECRET\" >/dev/null 2>&1" \
          > /var/spool/cron/crontabs/root
        # Täglich 08:00 (UTC): E-Mail-Verkaufsstrecken (Tag-genaue Taktung).
        echo "0 8 * * * wget -q -O- \"http://website:3000/api/sequences?secret=$$CRON_SECRET\" >/dev/null 2>&1" \
          >> /var/spool/cron/crontabs/root
        exec crond -f -l 8
