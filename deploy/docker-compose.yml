# Produktions-Deployment auf dem Hetzner-Server.
# Baut das Image aus dem Dockerfile und lässt die App NUR lokal auf
# 127.0.0.1:3000 lauschen – öffentlich erreichbar wird sie erst über nginx
# (siehe deploy/nginx/werdemeisterdeinergedanken.conf).
#
# Nutzung:
#   1. deploy/.env aus deploy/.env.example anlegen und Werte eintragen
#   2. docker compose -f deploy/docker-compose.yml up -d --build
#   3. Update später:  git pull && docker compose -f deploy/docker-compose.yml up -d --build
#
# Wichtig: NEXT_PUBLIC_* werden zur BUILD-Zeit ins Client-Bundle eingebacken
# (deshalb als build.args), die übrigen Werte gelten zur Laufzeit (environment).
#
# Vorlagen-Galerie: Der Host-Ordner mit den Vorlagen-Dateien
# (Standard /opt/website-vorlagen) wird read-only als Volume in den Container
# gemountet – siehe `volumes:` unten. Ohne diesen Mount ist /admin/vorlagen
# leer/kaputt (jede Datei 404).

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        # NEXT_PUBLIC_GA_ID wird zur Build-Zeit ins Client-Bundle eingebacken.
        # Ohne diese Zeile bleibt GA_ID leer und der Cookie-/Consent-Banner
        # erscheint nicht (GoogleAnalytics.tsx: `if (!GA_ID) return null`).
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID}
    image: wmdg-web:latest
    restart: unless-stopped
    # Nur an localhost binden – Zugriff ausschließlich über nginx
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Vorlagen-Galerie (/admin/vorlagen): Die Binärdaten (webp/PDF/ZIP, ~1 GB)
      # liegen bewusst NICHT im Image (content/vorlagen steht in .dockerignore),
      # sondern auf dem Host und werden hier read-only in den Container
      # eingehängt. OHNE diesen Mount ist /app/content/vorlagen im Container leer
      # und die Galerie zeigt nur gebrochene Bilder/Downloads – die Route
      # /admin/vorlagen/datei/… liefert dann für jede Datei 404 (nur die
      # PDF-Dokumente-Liste funktioniert, weil sie auf andere Routen verlinkt).
      # Befüllt/aktualisiert wird der Host-Ordner mit
      # tools/deploy/update-vorlagen-galerie.sh. Host-Pfad bei Bedarf über
      # VORLAGEN_VOLUME_DIR in deploy/.env überschreibbar.
      - ${VORLAGEN_VOLUME_DIR:-/opt/website-vorlagen}:/app/content/vorlagen:ro
    environment:
      NODE_ENV: production
      # Kanonischen Host erzwingen (neu./apex → www). Zum vorübergehenden
      # Abschalten während des Umbaus: ENFORCE_CANONICAL_HOST=false
      ENFORCE_CANONICAL_HOST: ${ENFORCE_CANONICAL_HOST:-true}
      # Kontaktformular (Resend)
      RESEND_API_KEY: ${RESEND_API_KEY}
      CONTACT_TO: ${CONTACT_TO}
      CONTACT_FROM: ${CONTACT_FROM}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
