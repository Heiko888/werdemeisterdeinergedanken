<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Werde Meister deiner Gedanken">
  <defs>
    <!-- Gold-Verlauf für die Wortmarke (≈100°) -->
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f2d489"/>
      <stop offset="1" stop-color="#e8c15f"/>
    </linearGradient>
    <!-- Marken-Glows (an docs/marketing brand-assets angelehnt) -->
    <radialGradient id="glowTR" cx="1101" cy="72" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9c15f" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#e9c15f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBL" cx="77" cy="691" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8842a" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#a8842a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="947" cy="662" r="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9a93a" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#d9a93a" stop-opacity="0"/>
    </radialGradient>
    <!-- Weiche Aura um die Bildmitte (dort sitzt später der Play-Button) -->
    <radialGradient id="aura" cx="640" cy="380" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9c15f" stop-opacity="0.13"/>
      <stop offset="0.66" stop-color="#e9c15f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Anthrazit-Basis + Glows -->
  <rect width="1280" height="720" fill="#090b10"/>
  <rect width="1280" height="720" fill="url(#glowTR)"/>
  <rect width="1280" height="720" fill="url(#glowBL)"/>
  <rect width="1280" height="720" fill="url(#glowBR)"/>
  <rect width="1280" height="720" fill="url(#aura)"/>

  <!-- Wortmarke im oberen Bereich; Bildmitte (Play-Button) und unterer Rand
       (Caption + Abdunklung des Video-Bausteins) bleiben bewusst frei. -->
  <g text-anchor="middle">
    <rect x="612" y="132" width="56" height="2" rx="1" fill="#e8c15f" fill-opacity="0.85"/>
    <text x="640" y="234" font-family="Georgia, 'Times New Roman', serif"
          font-size="78" font-weight="600" letter-spacing="-1">
      <tspan fill="#f4f2ec">Werde </tspan><tspan fill="url(#gold)" font-style="italic">Meister</tspan>
    </text>
    <text x="640" y="292" font-family="Inter, Arial, sans-serif" font-size="26"
          font-weight="700" letter-spacing="11" fill="#f4f2ec" fill-opacity="0.76">DEINER GEDANKEN</text>
  </g>
</svg>
